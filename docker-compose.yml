version: '3.8'

services:
  # MySQL数据库
  db:
    image: mysql:8.0
    container_name: game-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: production_password
      MYSQL_DATABASE: game_db
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pproduction_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端API服务
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: game-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DOCKER_ENV=true
    networks:
      - app-network
    ports:
      - "8080:8080"

  # 前端构建阶段
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    container_name: game-frontend-build
    volumes:
      - frontend_build:/app/dist

  # Nginx网关 (包含前端资源和反向代理配置)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: game-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend-build
    volumes:
      - frontend_build:/usr/share/nginx/html
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  frontend_build: 